# ==============================================================================
#  Redis — Configuração para GLPI (cache + sessões)
# ==============================================================================

# --- Rede ---
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# --- Limites ---
maxclients 1000
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Persistência ---
# AOF é mais seguro que RDB para sessões (perde no máximo 1s de escritas).
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshot RDB adicional (defesa em profundidade)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

# --- Logging ---
loglevel notice
logfile ""

# --- Segurança ---
# A senha vem por --requirepass via command line (ver docker-compose.yml)
# Comandos perigosos desabilitados em produção:
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_d4ee6c5a"
rename-command DEBUG ""
rename-command SHUTDOWN ""

# --- Slow log ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Lua scripts ---
lua-time-limit 5000
