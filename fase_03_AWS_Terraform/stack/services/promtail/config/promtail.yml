# ==============================================================================
#  Promtail — Coleta de logs dos containers Docker
# ==============================================================================
#  Descobre containers automaticamente via Docker socket (read-only).
#  Labels usadas: container (nome Docker Compose), service (nome do serviço),
#  image (imagem do container).
#  Envia para o Loki via HTTP push (loki:3100).
#
#  Nota: Promtail 3.x Docker SD não expõe __meta_docker_container_state nem
#  __meta_docker_container_log_stream no momento da descoberta de targets.
#  As labels disponíveis são as do Docker Compose e o nome do container.
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Nome do container (remove a barra inicial adicionada pelo Docker)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container

      # Nome do serviço Docker Compose — usado como 'job' (padrão Grafana/Loki)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: job

      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Imagem Docker Compose
      - source_labels: [__meta_docker_container_label_com_docker_compose_image]
        target_label: image

      # Filtra apenas containers do projeto glpi-dev
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        action: keep
        regex: glpi-dev
