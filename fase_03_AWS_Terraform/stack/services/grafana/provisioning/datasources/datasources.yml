# ==============================================================================
#  Grafana — Datasources provisionados automaticamente
# ==============================================================================
#  Estes datasources são criados na primeira subida do Grafana e não precisam
#  de configuração manual na UI. Qualquer alteração aqui é aplicada no restart.
# ==============================================================================
apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s      # deve coincidir com scrape_interval do prometheus.yml
      queryTimeout: 60s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
