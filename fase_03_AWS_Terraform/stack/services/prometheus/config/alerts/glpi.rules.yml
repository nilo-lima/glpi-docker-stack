# ==============================================================================
#  Regras de Alerta — GLPI Production Stack
# ==============================================================================
groups:

  - name: infrastructure
    interval: 1m
    rules:

      # Qualquer target de scrape inacessível por 5 minutos
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} está down"
          description: "O target {{ $labels.instance }} (job={{ $labels.job }}) está inacessível há mais de 5 minutos."

      # Disco acima de 85% — aviso
      - alert: HighDiskUsage
        expr: |
          (1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs", mountpoint="/"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs", mountpoint="/"}
          )) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disco do host acima de 85%"
          description: "Uso do disco em {{ $labels.mountpoint }}: {{ $value | printf \"%.1f\" }}%"

      # Disco acima de 95% — crítico
      - alert: CriticalDiskUsage
        expr: |
          (1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs", mountpoint="/"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs", mountpoint="/"}
          )) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disco do host crítico (>95%)"
          description: "Uso do disco em {{ $labels.mountpoint }}: {{ $value | printf \"%.1f\" }}%"

      # Memória disponível abaixo de 10%
      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memória disponível abaixo de 10%"
          description: "Apenas {{ $value | printf \"%.1f\" }}% de memória disponível no host."

      # Load average alto (>4 × núcleos por 10min)
      - alert: HighLoadAverage
        expr: node_load5 / count without(cpu, mode)(node_cpu_seconds_total{mode="idle"}) > 4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Load average alto no host"
          description: "Load5 normalizado: {{ $value | printf \"%.2f\" }} por núcleo."

  - name: mariadb
    interval: 30s
    rules:

      # MariaDB inacessível
      - alert: MariaDBDown
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MariaDB está inacessível"
          description: "O mysqld-exporter não consegue conectar ao MariaDB há mais de 1 minuto."

      # Muitas conexões (>80% do max_connections)
      - alert: MariaDBHighConnections
        expr: |
          mysql_global_status_threads_connected
          / mysql_global_variables_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MariaDB com muitas conexões abertas"
          description: "Conexões em uso: {{ $value | printf \"%.1f\" }}% do máximo configurado."

      # Muitas queries lentas acumuladas
      - alert: MariaDBSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MariaDB com queries lentas"
          description: "Taxa de queries lentas: {{ $value | printf \"%.2f\" }}/s nos últimos 5 minutos."

  - name: redis
    interval: 30s
    rules:

      # Redis inacessível
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis está inacessível"
          description: "O redis-exporter não consegue conectar ao Redis há mais de 1 minuto."

      # Memória do Redis acima de 90% do maxmemory (quando configurado)
      - alert: RedisHighMemory
        expr: |
          (redis_memory_used_bytes / redis_config_maxmemory) * 100 > 90
          and redis_config_maxmemory > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis com memória acima de 90% do limite"
          description: "Uso de memória Redis: {{ $value | printf \"%.1f\" }}% do maxmemory."

      # Taxa de erros no Redis
      - alert: RedisRejectedConnections
        expr: rate(redis_rejected_connections_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis rejeitando conexões"
          description: "Taxa de conexões rejeitadas: {{ $value | printf \"%.2f\" }}/s."
