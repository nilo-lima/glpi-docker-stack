; =============================================================================
;  GLPI 11 — Configuração PHP customizada
; =============================================================================
;  Sobrescreve os defaults da imagem oficial:
;    - Sessões armazenadas no Redis (compartilhamento entre containers)
;    - OPcache otimizado para produção
;    - Limites adequados para uploads de anexos e relatórios grandes
; =============================================================================

; --- Memória e tempo ---
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_input_vars = 10000

; --- Uploads (anexos de tickets, planilhas, fotos de inventário) ---
post_max_size = 100M
upload_max_filesize = 100M
file_uploads = On

; --- Sessões no Redis ---
; A senha do Redis é injetada via env REDIS_PASSWORD no formato:
;   tcp://redis:6379?auth=SENHA
; Ver: https://www.php.net/manual/en/redis.examples.php
session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=${REDIS_PASSWORD}"
session.gc_maxlifetime = 14400
session.cookie_lifetime = 0
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; --- Locking de sessões Redis (evita corrupção sob concorrência) ---
redis.session.locking_enabled = 1
redis.session.lock_retries = 100
redis.session.lock_wait_time = 50000

; --- OPcache (essencial para performance em produção) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0    ; produção: requer reload manual em deploys
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; --- Segurança ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_fopen = On
allow_url_include = Off

; --- Timezone ---
date.timezone = "${TZ}"
